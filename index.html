<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPERATION SIROCCO // Tactical Urban FPS</title>
    <link rel="icon" href="data:," />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0f14;
        color: #eef3f8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      }

      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* ================= TACTICAL HUD (< 8% screen area, pointer-events: none) ================= */
      #hud-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
        font-variant-numeric: tabular-nums;
      }

      /* Top-Left Radar Minimap */
      .hud-top-left {
        position: absolute;
        top: clamp(14px, 1.8vh, 22px);
        left: clamp(16px, 1.6vw, 26px);
      }

      .radar-frame {
        position: relative;
        width: 158px;
        height: 158px;
        border: 1px solid rgba(210, 228, 245, 0.32);
        border-radius: 6px;
        overflow: hidden;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
        background: rgba(10, 15, 20, 0.65);
      }

      .radar-cardinal {
        position: absolute;
        top: 4px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: #fbbf24;
        text-shadow: 0 1px 2px #000;
      }

      /* Top-Center Match Score, Timer & Zone Callout */
      .hud-top-center {
        position: absolute;
        top: clamp(14px, 1.8vh, 22px);
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .score-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 5px 14px;
        background: rgba(11, 16, 22, 0.76);
        border: 1px solid rgba(210, 228, 245, 0.24);
        border-radius: 4px;
        backdrop-filter: blur(4px);
      }

      .team-block {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      .team-tag {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
      }

      .team-block.alpha .team-tag,
      .team-block.alpha .team-score {
        color: #38bdf8;
      }

      .team-block.bravo .team-tag,
      .team-block.bravo .team-score {
        color: #f87171;
      }

      .team-score {
        font-size: 20px;
        font-weight: 800;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      .match-clock-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 10px;
        border-left: 1px solid rgba(255, 255, 255, 0.14);
        border-right: 1px solid rgba(255, 255, 255, 0.14);
      }

      .match-mode {
        font-size: 9px;
        letter-spacing: 0.12em;
        color: rgba(226, 236, 245, 0.72);
      }

      .match-clock {
        font-size: 14px;
        font-weight: 700;
        color: #f8fafc;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      .zone-callout {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.16em;
        color: rgba(248, 235, 210, 0.92);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
      }

      /* Top-Right Kill Feed */
      .hud-top-right {
        position: absolute;
        top: clamp(14px, 1.8vh, 22px);
        right: clamp(16px, 1.6vw, 26px);
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 5px;
      }

      .killfeed-item {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        background: rgba(11, 16, 22, 0.74);
        border-right: 2px solid #fbbf24;
        border-radius: 3px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      .kf-name.alpha { color: #38bdf8; }
      .kf-name.bravo { color: #f87171; }
      .kf-weapon {
        padding: 1px 5px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 2px;
        font-size: 9px;
        color: #cbd5e1;
      }
      .kf-hs {
        color: #fbbf24;
        font-weight: 800;
      }

      /* Center Crosshair, Hit Marker & Damage Arcs */
      .hud-center {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 320px;
        height: 320px;
      }

      #damage-arc-canvas {
        position: absolute;
        inset: 0;
      }

      .crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        transition: opacity 75ms linear;
      }

      .ch-dot {
        position: absolute;
        width: 2px;
        height: 2px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.95);
        transform: translate(-50%, -50%);
      }

      .ch-tick {
        position: absolute;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.95);
      }

      .ch-tick.top, .ch-tick.bottom {
        width: 2px;
        height: 6px;
        left: 0;
      }

      .ch-tick.left, .ch-tick.right {
        width: 6px;
        height: 2px;
        top: 0;
      }

      .hit-marker {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 22px;
        height: 22px;
        transform: translate(-50%, -50%);
        opacity: 0;
        transition: opacity 60ms linear, transform 80ms ease-out;
      }

      .hm-line {
        position: absolute;
        width: 7px;
        height: 2px;
        background: #ffffff;
        box-shadow: 0 0 2px #000;
      }

      .hit-marker.headshot .hm-line {
        background: #ff3b30;
      }

      .hm-line.l1 { top: 3px; left: 2px; transform: rotate(45deg); }
      .hm-line.l2 { top: 3px; right: 2px; transform: rotate(-45deg); }
      .hm-line.l3 { bottom: 3px; left: 2px; transform: rotate(-45deg); }
      .hm-line.l4 { bottom: 3px; right: 2px; transform: rotate(45deg); }

      .respawn-banner {
        position: absolute;
        top: 68%;
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
        padding: 6px 14px;
        background: rgba(185, 28, 28, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 4px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.1em;
      }

      /* Bottom-Left Health, Stance & Stamina */
      .hud-bottom-left {
        position: absolute;
        bottom: clamp(16px, 2.2vh, 26px);
        left: clamp(16px, 1.6vw, 26px);
        width: 210px;
        padding: 8px 12px;
        background: rgba(11, 16, 22, 0.74);
        border-left: 3px solid #38bdf8;
        border-radius: 4px;
        backdrop-filter: blur(4px);
      }

      .status-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 5px;
      }

      .hp-readout {
        display: flex;
        align-items: baseline;
        gap: 4px;
      }

      .hp-plus {
        color: #38bdf8;
        font-size: 16px;
        font-weight: 900;
      }

      .hp-num {
        font-size: 24px;
        font-weight: 800;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      .stance-pill {
        padding: 2px 6px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 3px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .hp-bar-track {
        position: relative;
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.14);
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 4px;
      }

      .hp-bar-trail {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        background: rgba(255, 190, 90, 0.75);
      }

      .hp-bar-fill {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        background: #ffffff;
      }

      .stamina-bar-track {
        width: 100%;
        height: 2px;
        background: rgba(255, 255, 255, 0.12);
      }

      .stamina-bar-fill {
        height: 100%;
        width: 100%;
        background: #38bdf8;
      }

      /* Bottom-Right Weapon & Ammo Cluster */
      .hud-bottom-right {
        position: absolute;
        bottom: clamp(16px, 2.2vh, 26px);
        right: clamp(16px, 1.6vw, 26px);
        width: 235px;
        padding: 8px 12px;
        background: rgba(11, 16, 22, 0.74);
        border-right: 3px solid #fbbf24;
        border-radius: 4px;
        backdrop-filter: blur(4px);
      }

      .reload-progress-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
        opacity: 0;
        transition: opacity 90ms linear;
      }

      .reload-label {
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.1em;
        color: #fbbf24;
      }

      .reload-track {
        flex: 1;
        height: 4px;
        background: rgba(255, 255, 255, 0.16);
        border-radius: 2px;
        overflow: hidden;
      }

      .reload-fill {
        height: 100%;
        width: 0%;
        background: #fbbf24;
      }

      .ammo-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .ammo-counts {
        display: flex;
        align-items: baseline;
        gap: 4px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      .mag-num {
        font-size: 26px;
        font-weight: 800;
      }

      .ammo-sep {
        font-size: 16px;
        color: rgba(255, 255, 255, 0.4);
      }

      .reserve-num {
        font-size: 15px;
        font-weight: 600;
        color: rgba(226, 236, 245, 0.78);
      }

      .firemode-stack {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 2px;
      }

      .firemode-badge {
        padding: 1px 6px;
        background: rgba(251, 191, 36, 0.2);
        border: 1px solid rgba(251, 191, 36, 0.55);
        border-radius: 3px;
        font-size: 10px;
        font-weight: 800;
        color: #fbbf24;
      }

      .grenade-badge {
        font-size: 9px;
        font-weight: 700;
        color: #cbd5e1;
      }

      .weapon-meta {
        margin-top: 4px;
        padding-top: 4px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .weapon-title {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #e2e8f0;
      }

      .weapon-hint {
        font-size: 8.5px;
        letter-spacing: 0.04em;
        color: rgba(203, 213, 225, 0.65);
      }

      /* Scoreboard (Tab) & Telemetry (Alt+9) */
      .hud-scoreboard {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(560px, 88vw);
        background: rgba(10, 15, 22, 0.92);
        border: 1px solid rgba(210, 228, 245, 0.28);
        border-radius: 6px;
        padding: 16px;
      }

      .sb-header {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.12em;
        color: #fbbf24;
        margin-bottom: 10px;
      }

      .sb-row {
        display: grid;
        grid-template-columns: 2.4fr repeat(5, 1fr);
        padding: 6px 8px;
        font-size: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .sb-row.header {
        font-weight: 800;
        color: #94a3b8;
      }

      .sb-row.alpha { color: #38bdf8; }
      .sb-row.bravo { color: #f87171; }

      .hud-telemetry {
        position: absolute;
        top: 185px;
        left: clamp(16px, 1.6vw, 26px);
        padding: 8px 10px;
        background: rgba(8, 12, 18, 0.84);
        border: 1px solid rgba(56, 189, 248, 0.35);
        border-radius: 4px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        line-height: 1.45;
        white-space: pre;
        color: #bae6fd;
      }

      /* ================= INTERACTIVE MENU OVERLAYS ================= */
      #menu-root {
        position: absolute;
        inset: 0;
        z-index: 25;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, rgba(10, 15, 22, 0.35) 0%, rgba(8, 12, 18, 0.78) 100%);
      }

      .menu-card {
        width: min(520px, 90vw);
        padding: 28px 32px;
        background: rgba(12, 18, 26, 0.88);
        border: 1px solid rgba(226, 232, 240, 0.22);
        border-top: 3px solid #fbbf24;
        border-radius: 6px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(8px);
      }

      .menu-eyebrow {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.18em;
        color: #fbbf24;
        margin-bottom: 6px;
      }

      .menu-title {
        font-size: 32px;
        font-weight: 900;
        letter-spacing: 0.06em;
        color: #f8fafc;
        margin-bottom: 10px;
      }

      .menu-title-sm {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.06em;
        color: #f8fafc;
        margin-bottom: 16px;
      }

      .menu-subtitle {
        font-size: 13.5px;
        line-height: 1.55;
        color: #cbd5e1;
        margin-bottom: 22px;
      }

      .menu-actions {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
      }

      .menu-actions.vertical {
        flex-direction: column;
      }

      .btn-primary, .btn-secondary {
        cursor: pointer;
        padding: 11px 18px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.1em;
        border-radius: 4px;
        transition: all 120ms ease;
      }

      .btn-primary {
        background: #fbbf24;
        color: #0f172a;
        border: none;
      }

      .btn-primary:hover {
        background: #fcd34d;
        transform: translateY(-1px);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.08);
        color: #f1f5f9;
        border: 1px solid rgba(255, 255, 255, 0.22);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.15);
      }

      .controls-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 7px 14px;
        padding-top: 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        font-size: 11.5px;
        color: #94a3b8;
      }

      .controls-grid span {
        display: inline-block;
        padding: 1px 5px;
        margin-right: 4px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 3px;
        font-weight: 700;
        color: #f8fafc;
        font-size: 10px;
      }

      .settings-rows {
        display: flex;
        flex-direction: column;
        gap: 11px;
        margin-bottom: 20px;
      }

      .setting-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12.5px;
        color: #e2e8f0;
      }

      .setting-row select, .setting-row input[type="range"] {
        width: 165px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
